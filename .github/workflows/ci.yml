name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Windows build (JDK 17)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The live smoke test skips itself on machines without a configured
      # vision route / capture target, so `build` stays green on CI by design.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIChat-desktop-jar
          path: build/libs/*.jar
